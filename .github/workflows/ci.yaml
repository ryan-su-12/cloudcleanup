name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # 3. Install linters
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      # 4. Run static analysis + linting
      - name: Run golangci-lint
        run: golangci-lint run ./...

      # 5. Run unit tests
      - name: Run Unit Tests
        run: go test -v ./...

      # 6. Run race detector (Go concurrency safety)
      - name: Race Detector
        run: go test -race ./...

      # 7. Build CLI binary
      - name: Build CLI
        run: go build -o bin/aws-cleanup-tool ./cmd/cli

  integration:
    name: Integration Tests (LocalStack)
    runs-on: ubuntu-latest
    needs: build-test

    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3,lambda,cloudwatch
        options: >-
          --health-cmd="curl -s http://localhost:4566/health | grep \"running\""
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # 8. Run integration tests (calls LocalStack instead of real AWS)
      - name: Run Integration Tests
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          LOCALSTACK_ENDPOINT: http://localhost:4566
        run: |
          go test -v ./tests/integration

